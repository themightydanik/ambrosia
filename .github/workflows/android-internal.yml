name: Android internal test build
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "debug: UI smoke APK; internal: signed AAB for Play internal testing"
        required: true
        type: choice
        options: [debug, internal]
      version_code:
        description: "Owner-selected increasing Google Play version code"
        required: true
      version_name:
        description: "Version name (major.minor.patch)"
        required: true
        default: "1.0.0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: android-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - name: Prepare bundled Android app
        env:
          GOOGLE_PLAY_APPLICATION_ID: ${{ vars.GOOGLE_PLAY_APPLICATION_ID }}
          NATIVE_API_ORIGIN: ${{ vars.NATIVE_API_ORIGIN }}
          NATIVE_VERSION_CODE: ${{ inputs.version_code }}
          NATIVE_VERSION_NAME: ${{ inputs.version_name }}
        run: npm run android:prepare
      - name: Restore owner upload key
        if: inputs.kind == 'internal'
        env:
          UPLOAD_KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_B64" || { echo 'Configure the upload keystore in the android-internal environment.'; exit 1; }
          printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ambrosia-upload.jks"
      - name: Compile test artifact (never upload to Play)
        env:
          BUILD_KIND: ${{ inputs.kind }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_KIND" = internal ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ambrosia-upload.jks"
            cd android
            ./gradlew --no-daemon bundleRelease
          else
            cd android
            ./gradlew --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ambrosia-android-${{ inputs.kind }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ambrosia-upload.jks"
