name: Security and synchronization checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ambrosia-browser" --save-exact playwright@1.62.1
          "$RUNNER_TEMP/ambrosia-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser scenarios
        run: NODE_PATH="$RUNNER_TEMP/ambrosia-browser/node_modules" npm run test:browser
      - name: Mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ambrosia-mobile
          path: /tmp/ambrosia-mobile-screenshots
          if-no-files-found: ignore
      - name: PostgreSQL migrations and RLS
        run: npm run test:db

  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Prepare synthetic fixture package (no owner products or credentials)
        env:
          GOOGLE_PLAY_APPLICATION_ID: org.example.ambrosia.billingfixture
          NATIVE_API_ORIGIN: https://example.invalid
          NATIVE_VERSION_CODE: 1
        run: npm run android:prepare
      - name: Compile official Android plugins
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
