name: Synchronization checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ambrosia-browser" --save-exact playwright@1.62.1
          "$RUNNER_TEMP/ambrosia-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser scenarios
        run: NODE_PATH="$RUNNER_TEMP/ambrosia-browser/node_modules" npm run test:browser
      - name: PostgreSQL migrations and RLS
        run: npm run test:db
