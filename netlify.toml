[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/supabase-config"
  to = "/.netlify/functions/supabase-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/account-status"
  to = "/.netlify/functions/account-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing-session"
  to = "/.netlify/functions/billing-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing-refresh"
  to = "/.netlify/functions/billing-refresh"
  status = 200
  force = true

[[redirects]]
  from = "/api/revenuecat-webhook"
  to = "/.netlify/functions/revenuecat-webhook"
  status = 200
  force = true

[functions."billing-reconcile"]
  schedule = "* * * * *"
